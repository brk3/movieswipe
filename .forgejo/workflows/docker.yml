name: Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: docker
    container: golang:1.26-bookworm
    steps:
      - name: Install git and docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git docker.io

      - name: Checkout
        run: git clone --depth 1 https://forgejo.aiectomy.xyz/pbourke/movieswipe.git .

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/movieswipe-linux-amd64 .

      - name: Build image
        run: docker build --build-arg TARGETARCH=amd64 -t forgejo.aiectomy.xyz/pbourke/movieswipe:latest .

      - name: Log in to Forgejo registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login forgejo.aiectomy.xyz -u pbourke --password-stdin

      - name: Push image
        run: docker push forgejo.aiectomy.xyz/pbourke/movieswipe:latest
