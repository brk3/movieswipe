apiVersion: apps/v1
kind: Deployment
metadata:
  name: movieswipe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: movieswipe
  template:
    metadata:
      labels:
        app: movieswipe
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: movieswipe
          image: ghcr.io/brk3/movieswipe:latest
          env:
            - name: DB_PATH
              value: /data/movieswipe.db
          envFrom:
            - secretRef:
                name: movieswipe-api-keys
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: movieswipe-data
